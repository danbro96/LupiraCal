name: mobile-release

on:
  push:
    branches: [release/android]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - package-lock.json
      - .github/workflows/mobile-release.yml

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-submit:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm i -g npm@12
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build and submit to Play internal testing
        working-directory: apps/mobile
        run: eas build --profile production --platform android --non-interactive --auto-submit --json > build.json
      - name: Tag the build
        working-directory: apps/mobile
        run: |
          tag="android/v$(jq -r '.[0].appVersion' build.json)+$(jq -r '.[0].appBuildVersion' build.json)"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
