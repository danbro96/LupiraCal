name: mobile-ota

on:
  workflow_dispatch:
    inputs:
      branch:
        description: EAS update branch (channel of the same name)
        type: choice
        options: [production, preview]
        default: production
      message:
        description: Update message
        type: string
        required: true

concurrency:
  group: mobile-ota
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm i -g npm@12
      - run: npm ci
      - name: Typecheck and test
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish update
        working-directory: apps/mobile
        env:
          BRANCH: ${{ inputs.branch }}
          MESSAGE: ${{ inputs.message }}
        run: eas update --branch "$BRANCH" --message "$MESSAGE" --non-interactive
