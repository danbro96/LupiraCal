services:
  cal-web:
    image: danbro96/lupira-cal-web:${IMAGE_TAG:-latest}
    container_name: lupira-cal-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Auth__Oidc__Authority: ${AUTH_AUTHORITY:-https://auth.lupira.com/application/o/lupira-cal/}
      Auth__Oidc__ClientId: ${AUTH_CLIENT_ID:-lupira-cal}
      Auth__Oidc__ClientSecret: ${AUTH_CLIENT_SECRET:-}
      # Audience scopes appended to the base OIDC scopes (indexes 0-4 in appsettings). Each triggers an
      # Authentik mapping that stamps the aud contact-api/geo-api require; without them the token is rejected.
      Auth__Oidc__Scopes__5: ${AUTH_SCOPE_CONTACT:-lupira-contact-aud}
      Auth__Oidc__Scopes__6: ${AUTH_SCOPE_GEO:-lupira-geo-aud}
      Auth__Oidc__Scopes__7: ${AUTH_SCOPE_TASKS:-lupira-tasks-aud}
      Auth__Oidc__Scopes__8: ${AUTH_SCOPE_LOCATION:-lupira-location-aud}
      ReverseProxy__Clusters__cal-api__Destinations__primary__Address: ${CAL_API_BASE_URL:-https://cal-api.lupira.com}
      ReverseProxy__Clusters__geo-api__Destinations__primary__Address: ${GEO_API_BASE_URL:-https://geo-api.lupira.com}
      ReverseProxy__Clusters__contact-api__Destinations__primary__Address: ${CONTACT_API_BASE_URL:-https://contact-api.lupira.com}
      ReverseProxy__Clusters__tasks-api__Destinations__primary__Address: ${TASKS_API_BASE_URL:-https://tasks-api.lupira.com}
      ReverseProxy__Clusters__photo-api__Destinations__primary__Address: ${PHOTO_API_BASE_URL:-https://photo-api.lupira.com}
      ReverseProxy__Clusters__comms-api__Destinations__primary__Address: ${COMMS_API_BASE_URL:-https://comms-api.lupira.com}
      DataProtection__KeyPath: /keys
      # Signing-certificate SHA-256 the Android app's App Links verify against (/.well-known/assetlinks.json).
      AppLinks__Sha256Fingerprints__0: ${APP_LINKS_SHA256:?required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?required}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-300000}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod}
    volumes:
      - cal-web-keys:/keys
    ports:
      - "${CAL_WEB_PORT:-40881}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/livez || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - medelynas_telemetry
      - default

networks:
  medelynas_telemetry:
    external: true
    name: medelynas_telemetry
  default:
    driver: bridge

volumes:
  cal-web-keys:
